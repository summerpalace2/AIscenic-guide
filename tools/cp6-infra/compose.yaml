name: scenic-cp6-integration

services:
  postgres:
    image: postgres:17-alpine
    profiles: [cp6-it]
    environment:
      POSTGRES_DB: cp6_test
      POSTGRES_USER: cp6_test
      POSTGRES_PASSWORD: cp6_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cp6_test -d cp6_test]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    profiles: [cp6-it]
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
