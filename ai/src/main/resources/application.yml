app:
  settings:
    default-site-name: "${APP_DEFAULT_SITE_NAME:渝游智策}"
    default-language: "${APP_DEFAULT_LANGUAGE:zh}"
    tts-enabled: "${APP_TTS_ENABLED:true}"
    knowledge-sync-enabled: "${APP_KNOWLEDGE_SYNC_ENABLED:true}"
    default-max-upload-size-mb: "${APP_DEFAULT_MAX_UPLOAD_SIZE_MB:50}"

spring:
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: "${app.settings.default-max-upload-size-mb}MB"
      max-request-size: "${app.settings.default-max-upload-size-mb}MB"
  data:
    redis:
      # YUYOUZHICE_REDIS_* is canonical for local/runtime configuration;
      # generic REDIS_* names remain compatibility fallbacks.
      host: "${YUYOUZHICE_REDIS_HOST:${REDIS_HOST:localhost}}"
      port: "${YUYOUZHICE_REDIS_PORT:${REDIS_PORT:6379}}"
      password: "${YUYOUZHICE_REDIS_PASSWORD:${REDIS_PASSWORD:}}"
      database: "${YUYOUZHICE_REDIS_DATABASE:${REDIS_DATABASE:0}}"
      timeout: "${YUYOUZHICE_REDIS_TIMEOUT_MS:${REDIS_TIMEOUT_MS:5000}}ms"
      ssl:
        enabled: "${YUYOUZHICE_REDIS_SSL:${REDIS_SSL:false}}"
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  ai:
    openai:
      api-key: "${DEEPSEEK_API_KEY:}"
      base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com}"
      chat:
        options:
          model: "${DEEPSEEK_MODEL:deepseek-v4-flash}"
          max-tokens: "${DEEPSEEK_MAX_TOKENS:8192}"
          temperature: 0.3
alibabacloud:
  dashscope:
    api-key: "${DASHSCOPE_API_KEY:}"
    embedding-url: "${DASHSCOPE_EMBEDDING_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}"
bailian:
  rerank-url: "${BAILIAN_RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}"
  connect-timeout-ms: "${BAILIAN_CONNECT_TIMEOUT_MS:3000}"
  read-timeout-ms: "${BAILIAN_READ_TIMEOUT_MS:3000}"
qdrant:
  host: "${QDRANT_HOST:localhost}"
  port: "${QDRANT_PORT:6334}"
  use-tls: "${QDRANT_USE_TLS:}"
  api-key: "${QDRANT_API_KEY:}"
  # Chat/RAG must target the isolated Production V3 rebuild collection; legacy scenic_guide is rejected in code.
  production-v2:
    collection: "${QDRANT_PRODUCTION_V2_COLLECTION:scenic_guide_production_v3_rebuild}"
    auto-create-indexes: "${QDRANT_PRODUCTION_V2_AUTO_CREATE_INDEXES:false}"
baidu:
  api-key: "${BAIDU_API_KEY:}"
  secret-key: "${BAIDU_SECRET_KEY:}"
  connect-timeout-ms: "${BAIDU_CONNECT_TIMEOUT_MS:5000}"
  read-timeout-ms: "${BAIDU_READ_TIMEOUT_MS:15000}"
  voice:
    asr-url: "${BAIDU_ASR_URL:https://vop.baidu.com/server_api}"
    tts-url: "${BAIDU_TTS_URL:https://tsn.baidu.com/text2audio}"
    token-url: "${BAIDU_TOKEN_URL:https://aip.baidubce.com/oauth/2.0/token}"
web-search:
  baidu:
    search-url: "${BAIDU_WEB_SEARCH_URL:https://www.baidu.com/s}"
    favicon-url: "${BAIDU_WEB_FAVICON_URL:https://www.baidu.com/favicon.ico}"
jwt:
  # Persistent deployments must provide JWT_SECRET; tests supply a test-only value.
  secret: "${JWT_SECRET:}"
  expires-days: 7
  revocation:
    # Enable only when the configured Redis instance is shared by all Java nodes.
    redis-enabled: "${JWT_REVOCATION_REDIS_ENABLED:false}"
admin:
  bootstrap:
    mode: "${ADMIN_BOOTSTRAP_MODE:disabled}"
    username: "${ADMIN_BOOTSTRAP_USERNAME:}"
    password: "${ADMIN_BOOTSTRAP_PASSWORD:}"
planner:
  request-timeout-ms: "${PLANNER_REQUEST_TIMEOUT_MS:45000}"
  geo-centroid:
    max-span-meters: "${PLANNER_GEO_CENTROID_MAX_SPAN_METERS:50000}"
  v1:
    enabled: "${PLANNER_V1_ENABLED:true}"
  runtime-location:
    search-radius-meters: "${PLANNER_RUNTIME_SEARCH_RADIUS_METERS:6000}"
    max-candidates: "${PLANNER_RUNTIME_MAX_CANDIDATES:40}"
    medium-budget-minutes: "${PLANNER_RUNTIME_MEDIUM_BUDGET_MINUTES:180}"
    long-budget-minutes: "${PLANNER_RUNTIME_LONG_BUDGET_MINUTES:300}"
    short-radius-meters: "${PLANNER_RUNTIME_SHORT_RADIUS_METERS:4000}"
    medium-radius-meters: "${PLANNER_RUNTIME_MEDIUM_RADIUS_METERS:6000}"
    long-radius-meters: "${PLANNER_RUNTIME_LONG_RADIUS_METERS:8000}"
    short-page-count: "${PLANNER_RUNTIME_SHORT_PAGE_COUNT:2}"
    medium-page-count: "${PLANNER_RUNTIME_MEDIUM_PAGE_COUNT:3}"
    long-page-count: "${PLANNER_RUNTIME_LONG_PAGE_COUNT:3}"
  llm:
    # 意图识别与行程叙事共用独立、有界的模型调用线程池，避免占用公共异步线程。
    executor-core-size: "${PLANNER_LLM_EXECUTOR_CORE_SIZE:2}"
    executor-max-size: "${PLANNER_LLM_EXECUTOR_MAX_SIZE:4}"
    executor-queue-capacity: "${PLANNER_LLM_EXECUTOR_QUEUE_CAPACITY:16}"
    intent:
      enabled: "${PLANNER_LLM_INTENT_ENABLED:false}"
      minimum-confidence: "${PLANNER_LLM_INTENT_MINIMUM_CONFIDENCE:0.75}"
      timeout-ms: "${PLANNER_LLM_INTENT_TIMEOUT_MS:3500}"
    narrative:
      enabled: "${PLANNER_LLM_NARRATIVE_ENABLED:false}"
      timeout-ms: "${PLANNER_LLM_NARRATIVE_TIMEOUT_MS:30000}"
context:
  keep-recent: 12
rag:
  semantic:
    enabled: "${RAG_SEMANTIC_ENABLED:true}"
    # DeepSeek-specific measured requests; disable when switching to an incompatible provider.
    disable-thinking: "${RAG_SEMANTIC_DISABLE_THINKING:true}"
    timeout-ms: "${RAG_SEMANTIC_TIMEOUT_MS:15000}"
    max-output-chars: "${RAG_SEMANTIC_MAX_OUTPUT_CHARS:8000}"
chat:
  stream:
    timeout-ms: "${CHAT_STREAM_TIMEOUT_MS:120000}"
memory:
  content:
    max-chars: "${MEMORY_CONTENT_MAX_CHARS:6000}"
  prompt:
    # Full profiles remain editable; model injection reserves safety restrictions first.
    max-chars: "${MEMORY_PROMPT_MAX_CHARS:6000}"
# 业务元数据数据库。生产环境在 Zeabur 配置 KNOWLEDGE_DB_TYPE=postgresql、
# KNOWLEDGE_DB_URL、KNOWLEDGE_DB_USERNAME、KNOWLEDGE_DB_PASSWORD；本地默认 SQLite。
knowledge:
  index:
    # 文档解析、Embedding、Qdrant 入库使用独立有界执行器。
    executor-core-size: "${KNOWLEDGE_INDEX_EXECUTOR_CORE_SIZE:1}"
    executor-max-size: "${KNOWLEDGE_INDEX_EXECUTOR_MAX_SIZE:2}"
    executor-queue-capacity: "${KNOWLEDGE_INDEX_EXECUTOR_QUEUE_CAPACITY:8}"
  database:
    type: "${KNOWLEDGE_DB_TYPE:sqlite}"
    url: "${KNOWLEDGE_DB_URL:}"
    username: "${KNOWLEDGE_DB_USERNAME:}"
    password: "${KNOWLEDGE_DB_PASSWORD:}"
    sqlite:
      busy-timeout-ms: "${KNOWLEDGE_SQLITE_BUSY_TIMEOUT_MS:5000}"
  retrieval:
    max-candidates: "${KNOWLEDGE_RETRIEVAL_MAX_CANDIDATES:200}"
    excerpt-chars: "${KNOWLEDGE_RETRIEVAL_EXCERPT_CHARS:4096}"
  upload-dir: "${KNOWLEDGE_UPLOAD_DIR:uploads/knowledge}"
# 服务端高德 Web Service 配置；未配置 Key 时由 Planner 返回明确的静态回退状态。
amap:
  web-service:
    base-url: "${AMAP_WEB_SERVICE_BASE_URL:https://restapi.amap.com}"
    key: "${AMAP_WEB_SERVICE_KEY:${AMAP_KEY:}}"
    timeout-ms: "${AMAP_WEB_SERVICE_TIMEOUT_MS:5000}"
    route-timeout-ms: "${AMAP_WEB_SERVICE_ROUTE_TIMEOUT_MS:4500}"
    max-concurrency: "${AMAP_WEB_SERVICE_MAX_CONCURRENCY:16}"
    # 规划请求内的路线段批处理调度边界；不使用公共 ForkJoinPool。
    hydration-concurrency: "${AMAP_WEB_SERVICE_HYDRATION_CONCURRENCY:8}"
    hydration-queue-capacity: "${AMAP_WEB_SERVICE_HYDRATION_QUEUE_CAPACITY:64}"
    hydration-route-timeout-ms: "${AMAP_WEB_SERVICE_HYDRATION_ROUTE_TIMEOUT_MS:15000}"
    qps-cooldown-ms: "${AMAP_WEB_SERVICE_QPS_COOLDOWN_MS:2000}"
    poi-max-keywords: "${AMAP_WEB_SERVICE_POI_MAX_KEYWORDS:3}"
    request-cache:
      enabled: "${AMAP_WEB_SERVICE_REQUEST_CACHE_ENABLED:true}"
      dedup-enabled: "${AMAP_WEB_SERVICE_REQUEST_DEDUP_ENABLED:true}"
      max-entries: "${AMAP_WEB_SERVICE_REQUEST_CACHE_MAX_ENTRIES:2048}"
      poi-ttl-ms: "${AMAP_WEB_SERVICE_POI_CACHE_TTL_MS:1800000}"
      route-ttl-ms: "${AMAP_WEB_SERVICE_ROUTE_CACHE_TTL_MS:1800000}"
      empty-route-ttl-ms: "${AMAP_WEB_SERVICE_EMPTY_ROUTE_CACHE_TTL_MS:5000}"
      weather-ttl-ms: "${AMAP_WEB_SERVICE_WEATHER_CACHE_TTL_MS:600000}"

trip:
  plan:
    max-days: "${TRIP_PLAN_MAX_DAYS:30}"
    max-stops-per-day: "${TRIP_PLAN_MAX_STOPS_PER_DAY:40}"
    max-total-stops: "${TRIP_PLAN_MAX_TOTAL_STOPS:500}"
    max-text-chars: "${TRIP_PLAN_MAX_TEXT_CHARS:20000}"
    max-json-bytes: "${TRIP_PLAN_MAX_JSON_BYTES:2097152}"

# 标准服务探针：BFF/部署平台统一读取 /actuator/health，避免把“接口不存在”误报为后端离线。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

# Empty uses the embedded OFL Chinese font. Explicit overrides must be embeddable CJK TTF/TTC files.
pdf:
  font-file: "${PDF_FONT_FILE:}"
